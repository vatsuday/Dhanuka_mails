# CI pipeline (Sprint 0, story S0.2). Documentation: docs/ci.md
#
# Supply-chain rules:
# - Third-party actions are pinned to full commit SHAs; the version is in the trailing comment.
# - Tools downloaded at runtime (gitleaks) are pinned and checked against a SHA-256 checksum.
# - Token permissions: none by default; checkout jobs get contents: read only; checkout keeps no credentials.
# - Triggered by `pull_request` (never `pull_request_target`) and uses no repository secrets, so pull-request
#   code runs with a read-only token and can't reach any secret.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No token permissions by default; each job requests only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: "12.11.2"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Nothing in CI may deliver email externally (ADR-011).
  SENDING_MODE: sink
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm (pinned)
        run: |
          npm install -g --allow-scripts=pnpm "pnpm@${PNPM_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Report check coverage (warns when a check runs zero packages)
        run: pnpm run checks:coverage

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      # Boots every Node app as a real process; dependencies are unreachable on purpose, so /ready must be 503.
      - name: Smoke-test every app (boot, /health, /ready, fail-fast, graceful shutdown)
        run: pnpm run smoke:apps

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm (pinned)
        run: |
          npm install -g --allow-scripts=pnpm "pnpm@${PNPM_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Show Docker version (required by Testcontainers)
        run: docker version

      - name: Integration tests
        run: pnpm run test:integration

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm (pinned)
        run: |
          npm install -g --allow-scripts=pnpm "pnpm@${PNPM_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (version matches the pinned @playwright/test)
        run: pnpm --filter @dm/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: End-to-end tests
        run: pnpm run test:e2e

  # The single required status check for branch protection (docs/ci.md).
  # It fails unless every job above succeeded, including when one was skipped or cancelled.
  ci-ok:
    name: CI OK
    if: always()
    needs: [secret-scan, quality, integration, e2e]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
