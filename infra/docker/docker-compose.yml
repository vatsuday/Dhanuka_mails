# Local development services. Development only, never used in staging or production.
# Image tags are pinned exactly and were checked to exist on Docker Hub on 2026-10-14.
# All ports bind to 127.0.0.1 so nothing is exposed to the network.
# Credentials are local-only defaults. Override them in the repository-root .env (gitignored),
# which compose reads because the npm scripts pass --project-directory .
#
# Not included yet: a local S3 emulator. The minio/minio image is no longer on Docker Hub
# (verified 2026-10-14). An emulator will be selected before Sprint 3 (see docs/PROGRESS.md).

name: dhanuka-mails

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dm_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dm_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dhanuka}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # BullMQ only. Must never evict keys (ADR-004).
  valkey-queue:
    image: valkey/valkey:8.1.10
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${VALKEY_QUEUE_PORT:-6379}:6379"
    volumes:
      - valkey-queue-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sessions, rate limits and caches. LRU eviction, no persistence (ADR-004).
  valkey-cache:
    image: valkey/valkey:8.1.10
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SMTP sink for the `sink` sending mode (ADR-011). Web UI on port 8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # SQS-compatible queue for the provider-event ingestion path (ADR-004).
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"
      - "127.0.0.1:${ELASTICMQ_UI_PORT:-9325}:9325"

volumes:
  postgres-data:
  valkey-queue-data:
